<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telegram Message Forwarder logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#shine)"/>

  <!-- source chat bubble -->
  <rect x="40" y="80" width="72" height="58" rx="17" fill="#FFFFFF"/>
  <path d="M58 134 L48 158 L80 136 Z" fill="#FFFFFF"/>
  <circle cx="62" cy="109" r="5.5" fill="#1E88D2"/>
  <circle cx="76" cy="109" r="5.5" fill="#1E88D2"/>
  <circle cx="90" cy="109" r="5.5" fill="#1E88D2"/>

  <!-- forwarding fork -->
  <path d="M112 109 H138 C162 109 154 70 178 70 H186"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M112 109 H138 C162 109 154 148 178 148 H186"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>

  <!-- arrowheads -->
  <path d="M186 54 L214 70 L186 86 Z" fill="#FFFFFF"/>
  <path d="M186 132 L214 148 L186 164 Z" fill="#FFFFFF"/>
</svg>
